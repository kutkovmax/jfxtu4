help.manual.title=Syntax & Commands
help.manual.format=Format: q,a,v,q'
help.manual.q=q — current state
help.manual.a=a — current symbol
help.manual.v=v — symbol to write or action
help.manual.qp=q' — next state
help.manual.cmd.right=> — move right
help.manual.cmd.left=< — move left
help.manual.cmd.stay== — stay
help.manual.cmd.halt=# — halt

help.hotkeys.title=Keyboard Shortcuts
help.hotkeys.edit.run=Ctrl+Enter — run the program
help.hotkeys.edit.tape.enter=Enter (when tape is focused) — run the program
help.hotkeys.run.toggle_quick=Enter / Ctrl+Enter — toggle quick run mode
help.hotkeys.run.step=Space — perform a single step (quick mode is stopped)
help.hotkeys.run.stop=Esc — return to editing the program and tape

help.example.title=Example Program
help.example.text=Replace 0 with 1 and vice versa in place:\n\
\n\
00, ,<,rep\n\
rep,0,1,mov  rep,1,0,mov  rep, ,>,fin  // rewrite cell\n\
mov,0,<,rep  mov,1,<,rep               // do a step to the left\n\
fin,0,>,fin  fin,1,>,fin  fin, ,#,fin  // finally, move to the end of word