help.title=Эмулятор машины Тьюринга
help.about.title=О программе
help.about.text=Учебное пособие для изучения машин Тьюринга в четвёрках.
help.author=Автор: Максим Кутьков
help.source=GitHub:
help.inspired=Вдохновлено:
help.manual.title=Синтаксис и команды
help.manual.format=Формат: q,a,v,q'
help.manual.q=q — текущее состояние
help.manual.a=a — обозреваемый знак
help.manual.v=v — знак или команда
help.manual.qp=q' — новое состояние
help.manual.cmd.right=> — сдвиг вправо
help.manual.cmd.left=< — сдвиг влево
help.manual.cmd.stay== — без движения
help.manual.cmd.halt=# — остановка

help.hotkeys.title=Горячие клавиши
help.hotkeys.edit.run=Ctrl+Enter — запуск программы на выполнение
help.hotkeys.edit.tape.enter=Enter (в фокусе ленты) — запуск программы на выполнение
help.hotkeys.run.toggle_quick=Enter / Ctrl+Enter — включить/выключить быстрый режим
help.hotkeys.run.step=Пробел — выполнить один шаг (быстрый режим отключается)
help.hotkeys.run.stop=Esc — вернуться к редактированию программы и ленты

help.example.title=Пример программы
help.example.text=Пример (ненормированная замена 0 на 1 и наоборот):\n\
\n\
00, ,<,rep\n\
rep,0,1,mov  rep,1,0,mov  rep, ,>,fin  # переписываем текущую ячейку\n\
mov,0,<,rep  mov,1,<,rep               // двигаемся на шаг влево\n\
fin,0,>,fin  fin,1,>,fin  fin, ,#,fin  # в конце работы перемещаемся в конец слова